[package]
name = "tc_prime_v2"
description = "Primality testing and prime generation for cryptography, over the integers of tc_bigint_v2."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []
alloc = ["tc_bigint_v2/alloc", "tc_modular_v2/alloc"]
shawe-taylor = ["dep:tc_digest", "alloc"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
tc_bigint_v2 = { version = "0.1.0", path = "../tc_bigint_v2", features = ["rand_core"] }
tc_modular_v2 = { version = "0.1.0", path = "../tc_modular_v2" }
tc_digest = { version = "0.1.0", optional = true }

[dev-dependencies]
tc_sha = "0.1.1"
rand = "0.10.3"
