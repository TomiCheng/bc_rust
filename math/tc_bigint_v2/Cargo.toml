[package]
name = "tc_bigint_v2"
description = "Big integers for cryptography."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []
alloc = ["tc_zeroize/alloc"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }
tc_constant_time = "0.1.0"
tc_zeroize = "0.1.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "arithmetic"
harness = false
required-features = ["alloc"]
