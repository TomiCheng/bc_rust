[package]
name = "tc_drbg"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NIST SP 800-90A deterministic random bit generators."

[dependencies]
rand_core = { workspace = true }
tc_block_cipher = "0.1.0"
tc_digest = "0.1.0"
tc_macs = "0.1.0"

[dev-dependencies]
tc_aes = "0.1.0"
tc_macs = { version = "0.1.0", features = ["hmac", "alloc"] }
tc_sha = "0.1.1"
