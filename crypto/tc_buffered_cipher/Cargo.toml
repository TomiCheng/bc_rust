[package]
name = "tc_buffered_cipher"
description = "Buffered cipher contracts and adapters over block, stream and AEAD ciphers."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[features]
default = []
alloc = ["tc_zeroize/alloc"]

[dependencies]
tc_block_cipher = "0.1.0"
tc_stream_cipher = "0.1.0"
tc_block_modes = "0.1.0"
tc_block_padding = "0.1.0"
tc_zeroize = "0.1.0"

[dev-dependencies]
tc_aes = "0.1.0"
tc_block_modes = { version = "0.1.0", features = ["alloc"] }
