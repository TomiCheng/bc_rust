[package]
name = "tc_rc2_wrap"
description = "CMS RC2 key wrapping from RFC 3217 for the tc_rust workspace."
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[dependencies]
tc_constant_time = "0.1.0"
rand_core = { workspace = true }
tc_block_cipher = "0.1.0"
tc_digest = "0.1.0"
tc_rc_cipher = "0.1.0"
tc_sha = "0.1.0"
tc_zeroize = { version = "0.1.0", features = ["alloc"] }
tc_key_wrap = { version = "0.1.0", path = "../tc_key_wrap" }
