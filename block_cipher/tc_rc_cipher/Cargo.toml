[package]
name = "tc_rc_cipher"
description = "RC2, RC5 and RC6 block ciphers."
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rustcrypto = ["dep:rc2", "rc2/zeroize"]
alloc = ["tc_zeroize/alloc"]

[dependencies]
tc_block_cipher = "0.1.0"
tc_zeroize = "0.1.0"
rc2 = { version = "0.9.0", optional = true }

